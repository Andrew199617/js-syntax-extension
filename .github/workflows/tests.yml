name: Tests
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  Jest:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2

    - name: Use Node.js
      uses: actions/setup-node@v1
      with:
        node-version: '20.x'

    - name: Install Modules
      run: npm ci

    - name: Unit, highlighting, and tsserver tests
      run: npm test
